# All tunable values live here. No paths, periods or thresholds in src/.

project:
  name: finance-variance-analysis-engine

paths:
  raw_data: data/raw
  output: data/output
  logs: logs
  database: data/variance.db

# Materiality: a variance is flagged only if it breaches BOTH tests.
#
# Thresholds are set PER FAMILY. Tangible maintenance runs ~$230k a quarter;
# software runs ~$14k. A single absolute threshold would make the software
# family permanently invisible - no overrun there could ever breach it.
# Different thresholds for different account groups is ordinary close practice.
materiality:
  tangible:
    absolute_threshold: 25000     # ~11% of quarterly tangible spend
    percent_threshold: 5.0
  intangible:
    absolute_threshold: 3000      # ~21% of quarterly software spend
    percent_threshold: 5.0

logging:
  level: INFO



# The extracts the pipeline expects, and the columns each one must have.
# C1 (control#1) Checks a file against list before anything else touches it. 
# Adding a third extract is a change here plus a file - not a code change. 
extracts:
  budget:
    file: budget.csv
    columns: [period,asset_id,family,cost_type,quantity,uom,amount]
  actual:
    file: actual.csv
    columns: [period,asset_id,family,cost_type,quantity,uom,amount] 
